server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /usr/share/nginx/html;

    # Use the same public application path as the remote deployment.
    location = / {
        return 302 /diaries/;
    }

    location = /diaries {
        return 302 /diaries/;
    }

    # Serve Angular assets beneath /diaries/ and fall back to index.html
    # for Angular client-side routes such as /diaries/signin.
    location /diaries/ {
        try_files $uri $uri/ /diaries/index.html;
    }
}
