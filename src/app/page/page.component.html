<div class="page">

  <app-pageheader (add)="onAddClick()" (select)="onSelectClick()" [title]="title$ | async"></app-pageheader>

  <div id="svg-container" [class.custom-cursor]="mode == 'add'">
    <svg id="zoomable-svg" xmlns="http://www.w3.org/2000/svg" [attr.viewBox]="viewBox"
      preserveAspectRatio="xMidYMid meet">
      <image *ngIf="diary && page"
        [attr.href]="fileServerUrl + '/' + diary.name + '/' + page.name + (page.extension || '.jpg')" x="0" y="0"
        [attr.width]="page.width" [attr.height]="page.height" />
    </svg>
  </div>

  <div *ngIf="mode == 'add'" class="debug">Add mode ON</div>

  <div class="padding"></div>

  <app-alerts></app-alerts>
  <!-- <app-alertbuttons></app-alertbuttons> -->
  <app-fullfooter></app-fullfooter>

</div>
