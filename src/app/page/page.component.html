<div class="page">

    <app-fullheader [title]="title"></app-fullheader>

    <div id="svg-container">
        <svg id="zoomable-svg"
             xmlns="http://www.w3.org/2000/svg"
             [attr.viewBox]="viewBox"
             preserveAspectRatio="xMidYMid meet">
          <image *ngIf="diary && page"
                 [attr.href]="fileServerUrl + '/' + diary.name + '/' + page.name + (page.extension || '.jpg')"
                 x="0" y="0"
                 [attr.width]="page.width"
                 [attr.height]="page.height" />
        </svg>
      </div>

    <div class="padding"></div>
    
    <app-alerts></app-alerts>
    <!-- <app-alertbuttons></app-alertbuttons> -->
    <app-fullfooter></app-fullfooter>

</div>
