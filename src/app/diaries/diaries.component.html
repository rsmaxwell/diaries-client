<div class="page">
  <app-fullheader></app-fullheader>


  <mat-card appearance="outlined" class="card">
    <mat-card-content class="content">


      <table mat-table [dataSource]="diaries" class="mat-elevation-z8">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> id </th>
          <td mat-cell *matCellDef="let diary"> {{diary.id}} </td>
        </ng-container>e

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> name </th>
          <td mat-cell *matCellDef="let diary"> {{diary.name}} </td>
        </ng-container>

        <tr mat-row *matRowDef="let diary; columns: displayedColumns;" (click)="selectItem(diary.id)"></tr>
      </table>


    </mat-card-content>
  </mat-card>

  <div class="padding"></div>
  <app-alerts></app-alerts>
  <!-- <app-alertbuttons></app-alertbuttons> -->
  <app-fullfooter></app-fullfooter>
</div>
