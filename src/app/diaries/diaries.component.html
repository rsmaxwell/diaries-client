<div class="page">
  <app-fullheader [title]="title"></app-fullheader>

  <main class="reader-main" aria-labelledby="diaries-heading">
    <div class="reader-shell">
      <header class="reader-heading">
        <p class="eyebrow">Your collection</p>
        <h1 id="diaries-heading">Diaries</h1>
        <p class="supporting-text">Choose a diary to browse its pages, or use the drag handles to change the reading order.</p>
      </header>

      @if (dataSource.data.length > 0) {
        <ol class="reader-list" aria-label="Diaries" cdkDropList
          [cdkDropListData]="dataSource.data" (cdkDropListDropped)="drop($event)">
          @for (diary of dataSource.data; track diary.id) {
            <li class="reader-item" cdkDrag cdkDragLockAxis="y" [cdkDragData]="diary">
              <button type="button" class="drag-handle" cdkDragHandle
                title="Drag to reorder {{diary.name}}" [attr.aria-label]="'Drag to reorder ' + diary.name">
                <span aria-hidden="true">⠿</span>
              </button>

              <button type="button" class="reader-link" (click)="selectItem(diary.id)">
                <span class="item-name">{{diary.name}}</span>
                <span class="item-metadata">
                  <span>Diary {{diary.id}}</span>
                  <span>Position {{diary.sequence}}</span>
                </span>
              </button>

              <div *cdkDragPreview class="reader-drag-preview">
                {{diary.name}}
                <small>Diary {{diary.id}}</small>
              </div>
              <div *cdkDragPlaceholder class="reader-drag-placeholder"></div>
            </li>
          }
        </ol>
      } @else {
        <p class="empty-state">No diaries are available yet.</p>
      }
    </div>
  </main>

  <app-fullfooter></app-fullfooter>
</div>
