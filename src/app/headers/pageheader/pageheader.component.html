<mat-toolbar class="header">
    <button mat-icon-button class="menu icon" aria-label="menu">
      <mat-icon>menu</mat-icon>
    </button>
    <span>{{title}}</span>

    <span class="spacer"></span>

    <button 
      mat-icon-button 
      title="Move or resize selected marquee"
      [disabled]="!hasSelectedMarquee"
      [class.active]="editMarqueeMode"
      [attr.aria-pressed]="editMarqueeMode"
      (click)="onEditMarqueeClick()">
      <mat-icon svgIcon="edit-marquee"></mat-icon>
    </button>

    <button mat-icon-button class="upload icon" aria-label="upload" (click)="onUploadClick()">
      <mat-icon svgIcon="upload"></mat-icon>
    </button>

    <button mat-icon-button class="list-files icon" aria-label="list-files" (click)="onListFilesClick()">
      <mat-icon svgIcon="files"></mat-icon>
    </button>

    <button mat-icon-button class="add icon" aria-label="add" (click)="onAddClick()">
      <mat-icon svgIcon="cross"></mat-icon>
    </button>

  </mat-toolbar>
