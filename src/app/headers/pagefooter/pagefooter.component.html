<mat-toolbar class="footer">

  <button mat-icon-button class="example-icon " aria-label="Home" (click)="home()">
    <mat-icon>home</mat-icon>
  </button>

  <button mat-icon-button class="example-icon" aria-label="Diaries" (click)="diaries()">
    <mat-icon> menu_book</mat-icon>
  </button>

  <button mat-icon-button class="example-icon" aria-label="page" (click)="pages()">
    <mat-icon>article</mat-icon>
  </button>
  
  <span class="example-spacer"></span>

  <!-- CENTERED ALERTS -->
  <div class="footer-alerts">
    <app-alerts></app-alerts>
  </div>

  <span class="example-spacer"></span>

  <button mat-icon-button class="example-icon ArrowBack-icon" aria-label="Example icon-button with ArrowBack icon" (click)="onBackClick()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <button mat-icon-button class="example-icon ArrowUpward-icon" aria-label="Example icon-button with ArrowUpward icon" (click)="onUpClick()">
    <mat-icon>arrow_upward</mat-icon>
  </button>

  <button mat-icon-button class="example-icon ArrowForward-icon" aria-label="Example icon-button with ArrowForward icon" (click)="onForwardClick()">
    <mat-icon>arrow_forward</mat-icon>
  </button>

</mat-toolbar>
