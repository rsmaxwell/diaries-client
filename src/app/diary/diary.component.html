<div class="page">
  <app-fullheader [title]="title"></app-fullheader>


  <div class="title">
    <div *ngIf="diary" class="title-content">

      <div class="title-item">{{diary.id}}</div>

      <div class="title-item">{{diary.name}}</div>

    </div>
  </div>


  <mat-card appearance="outlined" class="card">
    <mat-card-content class="content">

      <table mat-table [dataSource]="pages" class="mat-elevation-z8 diary-table">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="column-id"> id </th>
          <td mat-cell *matCellDef="let element" class="column-id"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="sequence">
          <th mat-header-cell *matHeaderCellDef class="column-sequence"> id </th>
          <td mat-cell *matCellDef="let element" class="column-sequence"> {{element.sequence}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="column-name"> name </th>
          <td mat-cell *matCellDef="let element" class="column-name"> {{element.name}} </td>
        </ng-container>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectItem(row.id)"></tr>

      </table>

    </mat-card-content>
  </mat-card>

  <div class="padding"></div>
  <!-- <app-alerts></app-alerts> -->
  <!-- <app-alertbuttons></app-alertbuttons> -->
  <app-fullfooter></app-fullfooter>
</div>
