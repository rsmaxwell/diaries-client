<app-fullheader [title]="title"></app-fullheader>

<div class="container" *ngIf="fragment">
  <svg
    #svgRef
    id="svg"
    xmlns="http://www.w3.org/2000/svg"
    version="1.1"
    preserveAspectRatio="xMidYMid meet"
    width="100%"
    height="100%" 
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    [ngClass]="[cursorStyle]"  
    (wheel)="onWheel($event)"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()"
    (contextmenu)="onRightClick($event)"
    >
      <g
        [attr.transform]="transformStyle"
      >
        <defs id="defs1">
          <mask maskUnits="userSpaceOnUse" id="mask15">
            <g id="g17" style="display:inline">
              <rect
                id="rect16"
                style="display:inline;fill:#808080;fill-opacity:1;stroke:#000000;stroke-width:1.5;stroke-linecap:round;stroke-opacity:0.0274136;paint-order:stroke fill markers"
                x="0"
                y="0"
                [attr.width]="width"
                [attr.height]="height"
              />
              <rect
                id="rect17"
                style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1.5;stroke-linecap:round;stroke-opacity:0.162098;paint-order:stroke fill markers"
                [attr.x]="fragment.marquee.rectangle.x"
                [attr.y]="fragment.marquee.rectangle.y"
                [attr.width]="fragment.marquee.rectangle.width"
                [attr.height]="fragment.marquee.rectangle.height"
              />
            </g>
          </mask>
        </defs>
    
        <image
          id="image1"
          [attr.href]="imageUrl"
          x="0"
          y="0"
          [attr.width]="width"
          [attr.height]="height"
          class="ng-star-inserted"
          mask="url(#mask15)"
          style="display:inline"
        />
      </g>
    </svg>


    <div class="text">
      <pre>{{ fragment.text }}</pre>
    </div>

</div>

<app-fullfooter></app-fullfooter>
