<app-pageheader (add)="onAddButtonClick()" [title]="title"></app-pageheader>

<div class="container" *ngIf="page">
  <svg
    #svgRef
    id="svg"
    xmlns="http://www.w3.org/2000/svg"
    version="1.1"
    preserveAspectRatio="xMidYMid meet"
    width="100%"
    height="100%" 
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    [ngClass]="[cursorStyle]"  
    (wheel)="onWheel($event)"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()"
    (contextmenu)="onRightClick($event)"
    (keydown)="onKeyDown($event)" tabindex="0"    
    >
      <g
        [attr.transform]="transformStyle"
      >
        <defs id="defs1">
          <mask maskUnits="userSpaceOnUse" id="mask15">
            <g id="g17" style="display:inline">
              <rect
                id="rect-base"
                x="0"
                y="0"
                [attr.width]="width"
                [attr.height]="height"
                class='baseMask'
              />

              <rect *ngFor="let marquee of otherMarquees"
                [attr.id]="marquee.id"
                [attr.x]="marquee.rectangle.x"
                [attr.y]="marquee.rectangle.y"
                [attr.width]="marquee.rectangle.width"
                [attr.height]="marquee.rectangle.height"
                class='otherMask'
               />

              <rect *ngIf="fragment"
                id="rect-selected"
                [attr.x]="fragment.rectangle.x"
                [attr.y]="fragment.rectangle.y"
                [attr.width]="fragment.rectangle.width"
                [attr.height]="fragment.rectangle.height"
                class='selectedMask'
              />

            </g>
          </mask>


          <mask maskUnits="userSpaceOnUse" id="mask16">
            <g id="g17" style="display:inline">
              <rect
                id="rect-base"
                x="0"
                y="0"
                [attr.width]="width"
                [attr.height]="height"
                class='baseMask'
              />

              <rect *ngIf="fragment"
                id="rect-selected"
                [attr.x]="fragment.rectangle.x"
                [attr.y]="fragment.rectangle.y"
                [attr.width]="fragment.rectangle.width"
                [attr.height]="fragment.rectangle.height"
                class='selectedMask'
              />

            </g>
          </mask>          
        </defs>
    
        <image
          id="image1"
          [attr.href]="imageUrl"
          x="0"
          y="0"
          [attr.width]="width"
          [attr.height]="height"
          class="ng-star-inserted"
          mask="url(#mask15)"
          style="display:inline"
        />

        <rect *ngFor="let marquee of otherMarquees"
          [attr.id]="marquee.id"
          [attr.x]="marquee.rectangle.x"
          [attr.y]="marquee.rectangle.y"
          [attr.width]="marquee.rectangle.width"
          [attr.height]="marquee.rectangle.height"
          class='other'
          (click)="onSelectMarquee(marquee)"
         /> 

        <image
          id="image2"
          [attr.href]="imageUrl"
          x="0"
          y="0"
          [attr.width]="width"
          [attr.height]="height"
          class="ng-star-inserted"
          mask="url(#mask16)"
          style="display:inline; pointer-events: none"
        />       
      </g>
    </svg>


<div class="text">
  <ng-container *ngIf="fragment; else noFragment">
    <pre>{{ fragment.text }}</pre>
  </ng-container>
  <ng-template #noFragment>
    <p>No fragment selected. Please click on a marquee to view details.</p>
  </ng-template>
</div>

</div>

  <app-pagefooter
  (back)="onBackPressed()"
  (up)="onUpPressed()"
  (forward)="onForwardPressed()"
></app-pagefooter>
