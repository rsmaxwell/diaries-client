<div class="text-panel-container" *ngIf="fragment; else noFragment">
  <div class="header">
    <div class="date-part">Year: {{ fragment.year }}</div>
    <div class="date-part">Month: {{ fragment.month }}</div>
    <div class="date-part">Day: {{ fragment.day }}</div>
    <div class="formatted-date">Formatted: {{ formattedDate }}</div>

    <!-- save button -->
    <button
      class="save-button"
      type="button"
      [disabled]="!hasEdits"
      [ngClass]="{ 'active': hasEdits }"
      (click)="onSave()"
    >
      Save
    </button>
  </div>

  <div class="body">
    <form [formGroup]="form">    
      <quill-editor
        formControlName="body"
        [modules]="editorModules"
        placeholder="Write something…">
      </quill-editor>
      </form>
  </div>
</div>

<ng-template #noFragment>
  <p>No fragment selected. Please click on a marquee to view details.</p>
</ng-template>
