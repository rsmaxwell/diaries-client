<header class="source-heading">
  <p>Original source</p>
  <h2>{{ sourceName }}</h2>
  <div class="viewer-controls" role="group" aria-label="Source image view controls">
    <button type="button" (click)="zoomOut()" [disabled]="!imageURL" aria-label="Zoom out" title="Zoom out">−</button>
    <button type="button" (click)="zoomIn()" [disabled]="!imageURL" aria-label="Zoom in" title="Zoom in">+</button>
    <button type="button" (click)="fitPage()" [disabled]="!imageURL">Fit page</button>
    <button type="button" (click)="fitSelection()" [disabled]="!imageURL || !marquee">Fit selection</button>
    <button
      type="button"
      (click)="toggleMarqueeDisplayMode()"
      [disabled]="!imageURL || !marquee"
      [attr.aria-label]="marqueeDisplayMode === 'focus' ? 'Use highlight style for the selected marquee' : 'Use focus style for the selected marquee'">
      {{ marqueeDisplayMode === 'focus' ? 'Use highlight style' : 'Use focus style' }}
    </button>
  </div>
</header>

<div class="viewer-frame" [class.is-empty]="!imageURL">
  @if (!imageURL) {
    <p class="viewer-state" role="status">No source page image is selected.</p>
  }

  <svg
    #svgRef
    id="svg"
    xmlns="http://www.w3.org/2000/svg"
    version="1.1"
    preserveAspectRatio="xMidYMid meet"
    width="100%"
    height="100%"
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    [ngClass]="[cursorStyle]"
    [class.highlight-mode]="marqueeDisplayMode === 'highlight'"
    [attr.aria-label]="imageURL ? sourceName + ', diary source page with selected marquee' : 'No diary source page image selected'"
    role="img"
    (wheel)="onWheel($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerleave)="onPointerLeave($event)"
    (pointercancel)="onPointerCancel($event)"
    (contextmenu)="onRightClick($any($event))"
    (keydown)="onKeyDown($any($event))"
    tabindex="0">
  <g [attr.transform]="transformStyle">
    <defs id="defs1">
      <mask maskUnits="userSpaceOnUse" id="mask15">
        <g id="g17" style="display:inline">
          <rect
            id="rect-base"
            x="0"
            y="0"
            [attr.width]="width"
            [attr.height]="height"
            class="baseMask15"
          />
        </g>
      </mask>

      <mask maskUnits="userSpaceOnUse" id="mask16">
        <g id="g18" style="display:inline">
          <rect
            id="rect-base"
            x="0"
            y="0"
            [attr.width]="width"
            [attr.height]="height"
            class="baseMask16"
          />
          <g *ngIf="marquee">            
            <rect
              id="rect-selected"
              [attr.x]="marquee.rectangle.x"
              [attr.y]="marquee.rectangle.y"
              [attr.width]="marquee.rectangle.width"
              [attr.height]="marquee.rectangle.height"
              class="selectedMask"
            />
          </g>
        </g>
      </mask>
    </defs>

    <image
      id="image1"
      [attr.href]="imageURL"
      x="0"
      y="0"
      [attr.width]="width"
      [attr.height]="height"
      mask="url(#mask15)"
    />

    <image
      id="image2"
      [attr.href]="imageURL"
      x="0"
      y="0"
      [attr.width]="width"
      [attr.height]="height"
      mask="url(#mask16)"
      style="pointer-events: none"
    />

    <rect
      *ngIf="marquee"
      [attr.x]="marquee.rectangle.x"
      [attr.y]="marquee.rectangle.y"
      [attr.width]="marquee.rectangle.width"
      [attr.height]="marquee.rectangle.height"
      class="selected-outline"
    />
  </g>
  </svg>
</div>
