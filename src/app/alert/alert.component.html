<app-fullheader [title]="title"></app-fullheader>


<mat-card class="string-list-card">
  <div class="alert-message {{ cssClass(alert) }}">
    <strong class="alert-kind">{{ typeLabel(alert) }}</strong>
    <span>{{ getMessage() }}</span>
  </div>

  @if (getDump()) {
    <pre class="alert-dump">{{ getDump() }}</pre>
  }
</mat-card>
  




<app-fullfooter></app-fullfooter>
